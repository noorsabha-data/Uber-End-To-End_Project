# This is a Declarative Automation Bundle definition for uber_dab.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: uber_dab
  uuid: ccc63638-74e1-474e-a5e9-e6000ffb8263

include:
  - resources/*.yml
  - resources/*/*.yml

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    presets:
      name_prefix: dev_${workspace.current_user.short_name}
      source_linked_deployment: false
    workspace:
      host: https://dbc-0203f616-7a83.cloud.databricks.com/
    
  prod:
    mode: production
    workspace:
      host: https://dbc-0203f616-7a83.cloud.databricks.com/
      # We explicitly deploy to /Workspace/Users/noorsabhaqureshi@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/noorsabhaqureshi@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: uber
      schema: prod
    permissions:
      - user_name: noorsabhaqureshi@gmail.com
        level: CAN_MANAGE
